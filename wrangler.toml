# Cloudflare Workers static-assets config.
#
# The connected build runs `npx wrangler deploy`, which deploys this whole
# site as an assets-only Worker — no server code, no entry point, no build
# step. `_headers` and `_redirects` inside public/ are supported natively.
name = "maxingconversion"
compatibility_date = "2026-07-29"

# Adding [[routes]] below silently disables the workers.dev fallback URL
# unless this is set explicitly. Keep it true even after the custom domain
# is working — it's the only URL that stays reachable if a Custom Domain
# ever fails to attach (as it did while the old Squarespace DNS records
# were still in place), so losing it means losing the site entirely.
workers_dev = true

# Branch pushes get their own preview URL, like Pages preview deployments.
preview_urls = true

[assets]
directory = "./public"

# Unmatched paths serve public/404.html with a 404 status.
not_found_handling = "404-page"

# Requests to /sales resolve to /sales/index.html and get a trailing slash,
# which is what every internal link and the _redirects rules assume.
html_handling = "auto-trailing-slash"

# Custom domain — makes the site answer at maxingconversion.com instead of
# the default *.workers.dev URL. Requires maxingconversion.com to already be
# an active zone on this Cloudflare account (nameservers pointed at
# Cloudflare) BEFORE the next deploy — that step has to happen at your
# domain registrar and can't be scripted from here. Once it is, the next
# `wrangler deploy` creates the Custom Domain automatically; no dashboard
# click needed. See SETUP.md.
[[routes]]
pattern = "maxingconversion.com"
custom_domain = true

[[routes]]
pattern = "www.maxingconversion.com"
custom_domain = true
